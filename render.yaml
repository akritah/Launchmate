services:
  # 1. FastAPI Async Backend
  - type: web
    name: launchmate-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: launchmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: launchmate-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-02-15-preview
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        value: gpt-4o
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        value: text-embedding-3-small

  # 2. Celery Background Worker & Beat Scheduler
  - type: worker
    name: launchmate-celery-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: celery -A app.workers.celery_app worker --beat -l info
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: launchmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: launchmate-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: launchmate-backend
          envVarKey: SECRET_KEY

  # 3. Next.js Frontend
  - type: web
    name: launchmate-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: starter
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: launchmate-backend
          property: host

databases:
  # Managed PostgreSQL with pgvector
  - name: launchmate-db
    plan: starter
    databaseName: onboarding_db
    user: postgres

# Managed Redis
redis:
  - name: launchmate-redis
    plan: starter
